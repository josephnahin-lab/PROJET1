        difficulties: { type: [string, "null"], maxLength: 1500 }
        learnings: { type: [string, "null"], maxLength: 1500 }
        url: { type: [string, "null"], format: uri, maxLength: 500, description: HTTPS seulement; pas de contenu public par défaut. }
        visibility: { type: string, const: private }
