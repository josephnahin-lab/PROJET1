        updatedAt: { type: string, format: date-time }
        attachments: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/PortfolioAttachment' } }
    PortfolioAttachment:
      type: object
      description: >-
        Métadonnées privées; le contenu se télécharge via
        /me/portfolio/{itemId}/attachments/{attachmentId}/content, credentials:
        include ou navigation first-party. Aucun lien de téléchargement ni URL
        de stockage n’est sérialisé. Taille positive, plafonnée à 5 242 880
        octets pour application/pdf et à 2 097 152 octets pour chaque média image.
      required: [id, name, mediaType, sizeBytes, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160, description: Nom d’affichage sûr dérivé du nom de fichier après normalisation et neutralisation; jamais le nom original brut. }
        mediaType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              mediaType: { const: application/pdf }
            required: [mediaType]
          then:
            properties:
              sizeBytes: { maximum: 5242880 }
        - if:
            properties:
              mediaType:
                enum: [image/jpeg, image/png, image/webp]
            required: [mediaType]
          then:
            properties:
              sizeBytes: { maximum: 2097152 }
