openapi: 3.1.0
info:
  title: Librescence API
  version: 1.0.0
  summary: Contrat HTTP versionné de Librescence
  description: |
    API REST de l’application Librescence. L’interface conserve un mode invité
    local utilisable sans compte. Les contenus publiquement lisibles sont
    exclusivement ceux ayant été explicitement publiés. Le contrat ne décrit
    pas une implémentation déjà déployée.
    Pour le Next.js first-party, Sanctum utilise exclusivement un cookie de
    session HttpOnly et le flux CSRF décrit ci-dessous; aucun bearer token
    n’est remis au navigateur. Les certificats sont désactivés et leurs
    opérations d’émission/vérification différées jusqu’à approbation des règles.
  contact:
    name: Équipe Librescence
  x-deferred-operations:
    - operation: Émission, liste et vérification de certificats
      reason: Décision requise sur critères d’admissibilité, contenu de preuve et conservation.
    - operation: Sessions, soumission et historique persistant des quiz
      reason: Désactivés jusqu’à approbation d’une politique de rétention.
    - operation: Stockage et consultation des demandes de contact
      reason: Désactivés jusqu’à approbation d’une politique de rétention.
servers:
  - url: /api/v1
    description: API versionnée
x-rate-limits:
  csrfBootstrap: 60/minute/IP HMAC (proposition)
  register: 3/15 minutes/IP HMAC (proposition)
  login: 5/15 minutes/IP HMAC + identifiant normalisé (proposition)
  logout: 30/minute/session; ne pas bloquer la première fermeture (proposition)
  forgotPassword: 3/hour/IP HMAC + identifiant normalisé (proposition)
  resetPassword: 5/hour/IP HMAC + identifiant normalisé (proposition)
  sendVerification: 3/hour/account (proposition)
  verifyEmail: 10/hour/IP HMAC (proposition)
  reauthenticate: 5/15 minutes/account + IP HMAC (proposition)
  deleteAccount: 2/day/account (proposition)
  deletionStatus: 20/hour/status token (proposition; durée du jeton à décider)
  profileRead: 120/minute/account (limite de lecture de compte, accountRead)
  accountWrite: 30/minute/account
  domainList: 60/minute/IP HMAC (proposition)
  domainRead: 60/minute/IP HMAC (proposition)
  pathwayRead: 60/minute/IP HMAC (proposition)
  catalogSearch: 30/minute/IP HMAC (proposition)
  recommendations: 20/minute/IP HMAC (proposition)
  quizRead: 60/minute/IP HMAC (proposition)
  guestQuizSession: 10/hour/IP HMAC (proposition; inactive tant que la session quiz est désactivée)
  guestQuizSubmit: 10/minute/IP HMAC et 5/minute/session/quiz (proposition; inactive tant que les tentatives sont désactivées)
  guestImport: 1/hour/account (proposition; plafond de taille distinct à décider)
  reminderUnsubscribe: 10/hour/IP HMAC (proposition; token valide idempotent)
  contactSubmit: 3/hour et 5/day/IP HMAC (proposition; inactive tant que le stockage contact est désactivé)
  portfolioUpload: 10/hour/account
  adminRead: 60/minute/account (proposition)
  adminWrite: 60/minute/account (proposition)
  note: |
    profileRead (lecture de compte, appelée accountRead dans cette note),
    accountWrite et portfolioUpload sont les limites initiales approuvées et
    effectivement appliquées aux opérations annotées. Valeurs initiales :
    120/minute/account pour profileRead, 30/minute/account pour accountWrite,
    10/hour/account pour portfolioUpload. Elles sont révisables par configuration
    et mesure sans supprimer la limitation. Les clés de ces limites sont liées
    au compte authentifié, jamais à l’IP brute; utiliser un limiteur partagé.
    Les autres valeurs restent des propositions ou sont inactives selon leur
    description; elles ne deviennent pas actives par simple présence ici.
    Si une limite active est atteinte, répondre 429 avec Retry-After. Les limites
    guestQuizSession, guestQuizSubmit et contactSubmit ne sont pas appliquées
    pendant la désactivation : ces routes retournent 503 avant leur traitement.
x-browser-security:
  csrf-bootstrap: GET /api/v1/auth/csrf-cookie
  session-cookie: HttpOnly; Secure en HTTPS; SameSite=Lax; Path=/
  csrf-cookie: XSRF-TOKEN (non HttpOnly, lisible par le client first-party uniquement)
  csrf-header: X-XSRF-TOKEN
  csrf-required-for: Toutes les opérations POST, PUT, PATCH et DELETE du client navigateur first-party, y compris les routes non authentifiées; l’exigence d’authentification Sanctum est distincte de la vérification CSRF.
  csrf-sequence: Après GET /auth/csrf-cookie, décoder XSRF-TOKEN et l’envoyer dans X-XSRF-TOKEN; inclure les cookies de session pour Sanctum. La réponse de login/register établit la session cookie, jamais un bearer.
  security-semantics: Les exigences security des opérations indiquent l’identité (cookie Sanctum, session de quiz ou jeton de suivi); la règle CSRF ci-dessus s’applique en plus, même quand l’opération ne liste pas ce header comme mécanisme d’identité.
  browser-requests: >-
    Inclure credentials; CORS limité à l’origine first-party approuvée; jamais
    de wildcard avec credentials. Exposer explicitement ETag avec
    Access-Control-Expose-Headers: ETag (sans wildcard) pour que le navigateur
    puisse lire le validateur; autoriser If-Match dans Access-Control-Allow-Headers.
    Pour le téléchargement des pièces jointes portfolio, exposer également
    Content-Disposition afin de lire le nom de fichier; cette réponse ne requiert
    pas ETag.
    CsrfToken définit la valeur et le format du header exigé par la règle ci-dessus.
  json-body-policy: >-
    Pour toute opération apprenant dont le corps est JSON, accepter uniquement
    Content-Type application/json (paramètres de charset permis); sinon répondre
    415 application/problem+json sans interpréter ni traiter le corps. Cela couvre
    notamment PATCH/PUT/POST profile, progress, lesson-progress, project-progress,
    notes, saved-resources, weekly-goal, guest-state import, fiches portfolio,
    préférences de rappel et désinscription de rappel; cela ne concerne pas GET,
    DELETE sans corps, multipart/form-data de téléversement, ni les routes
    désactivées qui répondent 503 avant traitement.
x-source-inventory:
  description: |
    Comptages source audités; ce manifeste décrit l'inventaire, jamais le contenu
    effectivement publié. canonicalSourceDomainIds signifie IDs source distincts
    parmi les 250 occurrences. Runtime resolution order est strict : filtre raw
    family active, applique domainAliases (hors paires identity), puis merge.
    Les mappings de familles historiques restent proposés, non appliqués.
  rawDomainRecords: 250
  canonicalSourceDomainIds: 192
  distinctSourceDomainIds: 192
  runtimeVisibleDomainIds: 101
  runtimeResolutionOrder: [filter_raw_family_active, resolve_domain_alias, merge_by_resolved_id]
  domainAliasSource: script.js:domainAliases; compare the exact key-target map with the seed manifest
  runtimeVisibleBreakdown:
    guided: 100
    specializedIt: 10
    generatedGeneric: 90
    web: 1
  historicalFamilyAliases:
    count: 7
    affectedRawRecords: 76
    initialStatus: proposed
    appliedToCanonicalFamily: false
    initialDisposition: quarantined_non_public
    recordCounts:
      hospitality: 12
      technical: 11
      agriculture: 11
      education: 11
      civic: 11
      science: 10
      health: 10
  domainIdIdentityAliases:
    count: 2
    pairs:
      - [gestion-equipe, gestion-equipe]
      - [gestion-projet, gestion-projet]
    resolution: identity_noop_outside_alias_graph
  domainTrackKeys:
    count: 98
    canonicalKeys: 90
    aliasSourceKeys: 8
    weeksPerKey: 4
    canonicalTopicRows: 360
    aliasTopicSourceRows: 32
    aliasPairs:
      social-entrepreneurship: entrepreneuriat-social
      team-management: gestion-equipe
      project-management: gestion-projet
      content-creation: creation-contenu
      content: creation-contenu
      photography: photo
      media-education: education-medias
      professional-communication: communication-professionnelle
  uuidv5SeedIds:
    namespace: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
    rootNamePattern: urn:librescence:content:v1/{entityType}/{canonicalSourceKey}/v{version}
    childNamePattern: urn:librescence:content:v1/{entityType}/{parentCanonicalSourceKey}/{stableKey}/v{version}
    randomOrFallbackIds: forbidden
  initialSourceReviewStatus: review_required
  genericFamilyTemplates:
    count: 11
    weeksPerTemplate: 4
    sourceQuestions: 44
    sourceOptions: 132
    stagesPerWeek: 3
    generatedPathways: 90
    weeksPerGeneratedPathway: 4
    sessionsPerGeneratedPathway: 12
    quizzesPerGeneratedPathway: 12
    questionsPerGeneratedPathway: 12
    optionsPerQuestion: 3
    generatedQuestionOptions: 3240
    publicationDefault: draft
  specializedItPathways:
    count: 10
    weeksPerPathway: 4
    sessionsPerPathway: 4
    quizzesPerPathway: 4
    questionsPerPathway: 8
    totalOptions: 313
    optionValidation: source-exact-per-question
  webPathway:
    modules: 4
    sessions: 12
    quizzes: 12
    questions: 24
    totalOptions: 72
    optionValidation: source-exact-per-question
  editorialRule: Source presence, migration completion, role assignment, and status alone never publish unreviewed content.
x-authorization-tests:
  - operationId: adminRegisterContentSource
    actor: unauthenticated
    expectedStatus: 401
  - operationId: adminRegisterContentSource
    actor: content_editor
    request: licenseStatus=approved_or_rejected
    expectedStatus: 422
    sideEffect: no source or audit row
  - operationId: reviewContentSource
    actor: content_editor
    expectedStatus: 403
    sideEffect: no status transition
  - operationId: publishPathway
    actor: content_editor
    expectedStatus: 403
    sideEffect: no publication
  - operationId: publishResource
    actor: content_editor
    expectedStatus: 403
    sideEffect: no publication
  - operationId: publishPathway
    actor: content_approver
    request: missing_or_unapproved_or_unaudited_source
    expectedStatus: 409
    sideEffect: no partial publication
  - operationId: publishResource
    actor: content_approver
    request: missing_or_unapproved_or_unaudited_source
    expectedStatus: 409
    sideEffect: no partial publication
tags:
  - name: Auth
  - name: Catalogue
  - name: Quiz
  - name: Mon espace
  - name: Portfolio
  - name: Rappels
  - name: Contact
  - name: Administration
security: []
paths:
  /auth/csrf-cookie:
    get:
      tags: [Auth]
      operationId: bootstrapCsrf
      summary: Initialiser les cookies de session et CSRF Sanctum
      description: |
        Établit le cookie de session HttpOnly et le cookie XSRF-TOKEN nécessaire
        au client navigateur first-party. Le client renvoie la valeur décodée de
        XSRF-TOKEN dans X-XSRF-TOKEN pour toute requête POST, PUT, PATCH ou DELETE.
        Cette route et les mutations authentifiées ne prennent jamais de bearer
        token; les credentials navigateur sont inclus dans la requête.
      security: []
      x-rate-limit: csrfBootstrap
      responses:
        '204':
          description: Cookies de session/CSRF initialisés.
          headers:
            Set-Cookie:
              schema: { type: array, items: { type: string } }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Créer un compte facultatif
      description: Inscription limitée par débit. La date de naissance n’est pas demandée. La création de compte n’est pas nécessaire pour consulter le catalogue.
      security: []
      x-rate-limit: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
                locale: { type: string, default: fr, maxLength: 16 }
      responses:
        '201':
          description: Compte créé; vérification e-mail peut être requise avant activation de fonctions sensibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Ouvrir une session facultative
      description: Les réponses d’identifiants invalides ne distinguent pas un compte absent d’un mot de passe incorrect. Les clients navigateur utilisent une session Sanctum et CSRF.
      security: []
      x-rate-limit: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Session établie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Fermer la session courante
      description: Révoque la session courante de façon idempotente. Une première demande de logout ne doit pas être refusée par la limite proposée.
      security: [{ sanctum: [] }]
      x-rate-limit: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session révoquée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Demander un lien de réinitialisation
      description: Réponse générique pour éviter la découverte de comptes.
      security: []
      x-rate-limit: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Demande acceptée sans révéler si le compte existe. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/email/verification-notification:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      summary: Renvoyer le lien de vérification
      security: [{ sanctum: [] }]
      x-rate-limit: sendVerification
      responses:
        '202': { description: Notification mise en file; réponse neutre si non applicable. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/email/verify/{userId}/{hash}:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Vérifier une adresse e-mail par lien signé à durée limitée
      security: []
      x-rate-limit: verifyEmail
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: hash
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
        - name: expires
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: signature
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '204': { description: Adresse vérifiée. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Réinitialiser le mot de passe
      security: []
      x-rate-limit: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                token: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
                password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
                password_confirmation: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '204': { description: Mot de passe changé; sessions précédentes révoquées. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Mon espace]
      operationId: getCurrentUser
      summary: Lire le compte courant
      security: [{ sanctum: [] }]
      x-rate-limit: profileRead
      responses:
        '200':
          description: Compte connecté.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Mon espace]
      operationId: requestAccountDeletion
      summary: Demander la suppression du compte
      description: |
        Requiert une ré-authentification récente, un jeton de confirmation à
        usage unique et confirm=true. L’acceptation passe le compte à
        deletion_pending, crée une demande traçable et révoque immédiatement
        toutes les sessions Sanctum. La réponse remet un jeton limité au suivi;
        il ne réactive pas le compte et ne permet aucune lecture de données.
      security: [{ sanctum: [] }]
      x-rate-limit: deleteAccount
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeletionRequest' }
      responses:
        '202':
          description: Demande enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [requestId, status, requestedAt, statusToken]
                    properties:
                      requestId: { type: string, format: uuid }
                      status: { type: string, enum: [deletion_pending] }
                      requestedAt: { type: string, format: date-time }
                      statusToken: { type: string, minLength: 32, maxLength: 256, description: "Jeton de suivi rendu une seule fois; à envoyer dans X-Deletion-Status-Token, ne permet pas de lire le compte." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /account-deletion-requests/{requestId}:
    get:
      tags: [Mon espace]
      operationId: getAccountDeletionStatus
      summary: Suivre une demande de suppression après révocation de session
      description: Le jeton de suivi transmis lors de la demande est requis; la réponse ne contient que son état. Durée de validité du jeton à décider avant implémentation.
      security: [{ deletionStatusToken: [] }]
      x-rate-limit: deletionStatus
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: État minimal de la demande.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status, requestedAt]
                    properties:
                      status: { type: string, enum: [deletion_pending, completed] }
                      requestedAt: { type: string, format: date-time }
                      completedAt: { type: [string, "null"], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/reauthenticate:
    post:
      tags: [Auth]
      operationId: reauthenticate
      summary: Confirmer récemment le mot de passe avant une action sensible
      security: [{ sanctum: [] }]
      x-rate-limit: reauthenticate
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Grant à usage unique et durée courte; durée exacte à configurer avant déploiement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthenticationGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /me/profile:
    get:
      tags: [Mon espace]
      operationId: getProfile
      summary: Lire mon profil et mes préférences
      x-rate-limit: profileRead
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Profil privé.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Mon espace]
      operationId: updateProfile
      summary: Modifier mes préférences
      x-rate-limit: accountWrite
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /domains:
    get:
      tags: [Catalogue]
      operationId: listDomains
      summary: Parcourir les domaines publiés
      x-rate-limit: domainList
      description: N’inclut aucun domaine en préparation, brouillon ou retiré. Pagination cursor; les recommandations ne changent pas le statut éditorial.
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: family
          in: query
          schema: { type: string, maxLength: 80 }
        - name: q
          in: query
          description: Recherche textuelle simple dans le nom et le résumé publiés.
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Page de domaines publiés.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Domain' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /domains/{domainId}:
    get:
      tags: [Catalogue]
      operationId: getDomain
      summary: Lire un domaine publié
      x-rate-limit: domainRead
      security: []
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: Domaine et parcours publiés.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DomainDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
