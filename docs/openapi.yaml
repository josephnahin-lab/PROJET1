    GuestImportRequest:
      description: Import limité à une allowlist des propriétés réellement stockées et normalisées par la source statique. Chaque objet est fermé; toute propriété inconnue ou champ ignoré provoque 422 et n’est jamais importé implicitement. La limite en octets est à décider avant implémentation.
      oneOf:
        - $ref: '#/components/schemas/GuestImportV2Request'
        - $ref: '#/components/schemas/GuestImportLegacyRequest'
    GuestImportV2Request:
      type: object
      additionalProperties: false
      required: [clientImportId, sourceKey, state]
      properties:
        clientImportId: { type: string, format: uuid }
        sourceKey: { type: string, enum: [besa.learning.v2, capClair.learning.v2] }
        state: { $ref: '#/components/schemas/GuestImportState' }
    GuestImportLegacyRequest:
      type: object
      additionalProperties: false
      required: [clientImportId, sourceKey, completedIndexes]
      properties:
        clientImportId: { type: string, format: uuid }
        sourceKey: { type: string, const: capClairCompleted }
        completedIndexes:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 4 }
    GuestImportState:
      type: object
      additionalProperties: false
      minProperties: 2
      description: |
        Allowlist source-derived de defaultState()/normalizeState() version 3.
        Cette valeur est une projection d’import construite localement, pas le JSON brut `besa.learning.v2` ou `capClair.learning.v2`.
        Le client retire localement avant envoi `quizAnswers`, `awards`, `xp`, `coins`,
        `avatar`, `displayName`, les noms, `birthDate`, `onboardingComplete` et les métadonnées
        de fichiers; aucun de ces champs n’est transmis au serveur. Les propriétés présentes
        dans cette projection mais absentes de l’allowlist sont rejetées.
        Exclut notamment credentials, birthDate, noms, displayName, avatar,
        notes non présentes dans ce state, files/Blobs IndexedDB, awards/xp/coins
        recalculables et toute clé non listée. `quizResults` sont exclus de toute
        importation serveur durable; une valeur non vide entraîne 503 pour toute
        la requête.
      required: [version]
      properties:
        version: { type: integer, const: 3 }
        domain: { type: [string, "null"], pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        plan: { type: string, enum: [two-weeks, four-weeks, eight-weeks, flex] }
        completed:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            enum: [web-map, web-first-site, web-setup, html-structure, html-links-images, html-semantics, css-first-style, css-layout, css-responsive, js-first-steps, js-events, web-quality]
        quizResults:
          type: object
          maxProperties: 250
          description: Schéma de détection uniquement; tout objet non vide déclenche 503 FEATURE_DISABLED et annule l’import entier. Omettre ou envoyer vide pour importer les autres données.
          propertyNames:
            pattern: '^(?:web-map|web-first-site|web-setup|html-structure|html-links-images|html-semantics|css-first-style|css-layout|css-responsive|js-first-steps|js-events|web-quality|specialty:[a-z0-9]+(?:-[a-z0-9]+)*:[0-9]+-[0-9]+)$'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [attempts, last, best, lastAnswers, questionCount]
            properties:
              attempts: { type: integer, minimum: 1, maximum: 10000 }
              last: { type: integer, minimum: 0, maximum: 2 }
              best: { type: integer, minimum: 0, maximum: 2 }
              lastAnswers:
                type: array
                maxItems: 2
                items: { type: integer, minimum: -1, maximum: 3 }
              questionCount: { type: integer, minimum: 1, maximum: 2 }
        specialtyProgress:
          type: object
          maxProperties: 250
          propertyNames: { pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
          additionalProperties: { $ref: '#/components/schemas/GuestSessionProgress' }
        savedResources:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [url, title, source]
            properties:
              url: { type: string, format: uri, maxLength: 1000, pattern: '^https://' }
              title: { type: string, maxLength: 180 }
              source: { type: string, maxLength: 100 }
        weeklyGoal: { type: integer, enum: [2, 3, 5, 7] }
        activityDates:
          type: array
          maxItems: 400
          uniqueItems: true
          items: { type: string, format: date }
        project:
          type: object
          additionalProperties: false
          properties:
            checks:
              type: array
              maxItems: 6
              items: { type: boolean }
            url: { type: string, maxLength: 500, pattern: '^(https://.*)?$' }
            completed: { type: boolean }
        portfolio:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/GuestPortfolioItem' }
        profile:
          type: object
          additionalProperties: false
          properties:
            interests:
              type: array
              maxItems: 8
              uniqueItems: true
              items: { type: string, enum: [digital, entreprendre-gerer, creation-medias, metiers-techniques-industrie, agriculture-environnement, sciences-ingenierie, sante-accompagnement, education-competences, droit-action-citoyenne, mobilite-accompagnement, culture] }
            resourceLanguage: { type: string, enum: [fr, en, es] }
            theme: { type: string, enum: [light, dark] }
            learningMode: { type: string, enum: [guided, free] }
    GuestSessionProgress:
      type: array
      maxItems: 12
      uniqueItems: true
      items: { type: string, pattern: '^[0-9]+-[0-9]+$' }
