        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /me/imports/guest-state:
    post:
      tags: [Mon espace]
      operationId: importGuestState
      summary: Importer de façon idempotente une progression invitée
      description: |
        Authentification requise, mais le compte reste facultatif pour le reste
        de l’application. N’écrase jamais un état serveur par une absence ou une
        valeur plus ancienne. La requête est limitée aux variantes strictement
        fermées GuestImportV2Request et GuestImportLegacyRequest. Une même
        Idempotency-Key avec le même checksum renvoie le rapport initial; la
        même clé avec un payload différent répond 409. Les sources locales ne
        sont jamais supprimées. Plafond en octets à décider avant implémentation;
        les limites de tableaux de schéma ne valent pas plafond total. Si
        Content-Type n'est pas application/json (paramètres charset permis),
        répondre 415 avant toute lecture ou validation du corps, traitement de
        Idempotency-Key, limite de débit, traitement de lot ou mutation. Le 503
        FEATURE_DISABLED (feature=imported_quiz_results) ne s'applique qu'après
        acceptation du Content-Type et validation d'un corps JSON valide : si
        state.quizResults contient au moins un résultat, rejeter atomiquement
        toute la requête avant idempotence, limite de débit, écriture de lot ou
        toute fusion; ne pas importer le reste partiellement.
        La détection se fait en mémoire seulement; le corps n’est ni conservé
        dans des logs, cache, outbox ou analytics.
        Le client peut recommencer après confirmation avec quizResults omis.
      security: [{ sanctum: [] }]
      x-rate-limit: guestImport
      x-disabled-feature: imported_quiz_results
      x-disabled-condition: state.quizResults has at least one entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestImportRequest' }
      responses:
        '200':
          description: Rejeu idempotent d’un import déjà appliqué.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GuestImportReport' }
        '201':
          description: Import appliqué ou partiellement appliqué, sans suppression source.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GuestImportReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/FeatureDisabled' }
        default: { $ref: '#/components/responses/Problem' }
