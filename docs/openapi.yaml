  /admin/pathways/{pathwayId}/publish:
    post:
      tags: [Administration]
      operationId: publishPathway
      summary: Valider et publier une version de parcours
      description: |
        Requiert rôle approbateur; exécute les contrôles de complétude, unicité
        des IDs et absence de correction dans les réponses publiques. `reviewedSourceIds`
        doit être exactement la fermeture des sources attachées au pathway et à
        ses semaines, séances, quiz/questions, projets et ressources incluses.
        Chaque source doit exister, être `approved`, avoir reviewer/date et
        événement de revue audité. Toute différence, source rejetée/non revue ou
        audit manquant entraîne 409/422 sans mutation. L’événement de publication
        enregistre les IDs exacts. Quiz attempts/contact/certificats restent différés.
      security: [{ sanctum: [] }]
      x-required-role: content_approver
      parameters:
        - name: pathwayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reviewedSourceIds]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reviewedSourceIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid, description: "IDs exacts de toutes les sources de la fermeture éditoriale, sans omission ni ajout." }
      responses:
        '200':
          description: Version publiée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminPathway' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }
