  /me/portfolio/{itemId}/attachments/{attachmentId}/content:
    get:
      tags: [Portfolio]
      operationId: downloadPortfolioAttachmentContent
      summary: Télécharger le contenu privé d’une pièce jointe
      description: >-
        Exige la session cookie Sanctum first-party. Le GET ne requiert pas de
        vérification CSRF. Le client construit ce chemin avec les IDs de la fiche
        et de la pièce jointe, et demande avec credentials: include (ou navigation
        first-party). Sur tout fetch cross-origin autorisé, CORS n’accepte que
        l’origine first-party configurée, avec credentials; Content-Disposition
        est exposé au navigateur. Le serveur vérifie l’appartenance de la fiche
        au compte et le rattachement de la pièce jointe à cette fiche avant de
        streamer depuis le stockage privé. Aucun redirect vers un stockage public,
        aucune URL signée/tokenisée ni URL de stockage en clair n’est retournée
        ou connue des logs applicatifs. Le Content-Type de la réponse binaire
        correspond au mediaType vérifié de la pièce jointe.
      x-rate-limit: profileRead
      security: [{ sanctum: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contenu binaire streamé après autorisation; le Content-Type correspond au mediaType vérifié, sans ETag requis.
          headers:
            Content-Disposition:
              description: >-
                attachment avec filename sécurisé, neutralisé pour l’en-tête;
                aucune valeur fournie par le client n’est utilisée comme chemin.
              schema: { type: string }
            Cache-Control:
              description: Interdit la mise en cache partagée ou persistante.
              schema: { type: string, const: 'private, no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /me/portfolio/{itemId}/attachments/{attachmentId}:
    delete:
      tags: [Portfolio]
      operationId: deletePortfolioAttachment
      summary: Supprimer une pièce jointe
      x-rate-limit: accountWrite
