  /admin/quizzes/{quizId}/publish:
    post:
      tags: [Administration, Quiz]
      operationId: publishQuiz
      summary: Valider et publier un quiz
      description: Vérifie questions/options/explications, sources toutes approuvées avec reviewer/date et audit, et rattachement au cours parent. Une source non revue échoue sans publication.
      security: [{ sanctum: [] }]
      x-required-role: content_approver
      parameters:
        - name: quizId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quiz publié. La représentation publique reste distincte et ne contient pas la clé.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminQuiz' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/content-sources:
    post:
      tags: [Administration]
      operationId: adminRegisterContentSource
      summary: Enregistrer la provenance d’un contenu
      description: |
        Enregistre une source en `unknown` ou `review_required` uniquement.
        `content_editor` ne peut pas créer ou auto-approuver une source :
        `approved` et `rejected` sont refusés ici. La revue est une transition
        séparée réservée à `content_approver`.
      security: [{ sanctum: [] }]
      x-required-role: content_editor
      x-rate-limit: adminWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentSourceWrite' }
      responses:
        '201':
          description: Source éditoriale enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContentSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/content-sources/{sourceId}/review:
    post:
      tags: [Administration]
      operationId: reviewContentSource
      summary: Approuver ou rejeter les droits d’une source
      description: |
        Transition distincte et réservée à `content_approver`. Le serveur
        dérive `reviewedBy` de l’utilisateur Sanctum et génère `reviewedAt`;
        le client ne peut pas choisir ces valeurs. Le reviewer Sanctum doit
        être distinct de l’auteur de la révision (`revisionAuthorId`), même si
        les rôles se cumulent; sinon la requête échoue avec `409` sans changer
        le statut ni écrire d’audit. Écrit la décision et
        `content_audit_events` atomiquement. `approved` atteste les droits de
        cette source uniquement et ne publie aucun domaine, pathway, quiz ou
        ressource. Les sources rejetées restent traçables, mais ne peuvent pas
        satisfaire une publication.
      security: [{ sanctum: [] }]
      x-required-role: content_approver
      x-rate-limit: adminWrite
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentSourceReviewRequest' }
      responses:
        '200':
          description: Décision enregistrée; reviewer et date sont générés côté serveur.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContentSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/contacts:
    get:
      tags: [Administration, Contact]
      operationId: adminListContacts
      summary: Historique des contacts (désactivé)
      description: Aucun stockage de contact n’est actif; même le rôle support_contact reçoit 503 FEATURE_DISABLED. Aucune file n’est lue et aucune donnée personnelle n’est retournée.
      security: [{ sanctum: [] }]
      x-required-role: support_contact
      x-disabled-feature: contact_storage
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/FeatureDisabled' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/contacts/{contactId}:
    patch:
      tags: [Administration, Contact]
      operationId: adminUpdateContact
      summary: Modifier un contact (désactivé)
      description: Aucune ligne de contact n’est active; retourne 503 FEATURE_DISABLED sans rechercher ni modifier une demande.
      security: [{ sanctum: [] }]
      x-required-role: support_contact
      x-disabled-feature: contact_storage
      parameters:
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/FeatureDisabled' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Cookie de session Sanctum HttpOnly du client first-party. Aucun bearer
        token n’est exposé au navigateur ni décrit comme mécanisme de cette API.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valeur décodée du cookie XSRF-TOKEN, obligatoire pour les mutations navigateur.
    quizGuest:
      type: apiKey
      in: header
      name: X-Quiz-Session
      description: Schéma réservé à une éventuelle réactivation; aucune session ni aucun jeton quiz n’est actuellement émis.
    deletionStatusToken:
      type: apiKey
      in: header
      name: X-Deletion-Status-Token
      description: Jeton limité à la lecture de l’état de la demande de suppression correspondante.
  parameters:
    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque retourné par la page précédente.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Valeur décodée du cookie XSRF-TOKEN après GET /auth/csrf-cookie.
      schema: { type: string, minLength: 16, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la version lue; rejet 412 si la ressource a changé.
      schema: { type: string, maxLength: 128 }
  responses:
    Unauthorized:
      description: Authentification nécessaire ou session invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle insuffisant ou action interdite.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource absente, non publiée ou non accessible au compte courant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflit de version, état ou clé d’idempotence.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: ETag ne correspond plus à la version courante.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Requête mal formée ou valeur hors règles.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    RateLimitError:
      description: Limite de débit atteinte; réessayer après le délai annoncé dans Retry-After.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          schema: { type: integer, minimum: 1 }
        RateLimit-Remaining:
          schema: { type: integer, minimum: 0 }
        RateLimit-Reset:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Corps ou fichier supérieur à la limite acceptée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Type de média non accepté. Pour les opérations JSON apprenant, tout corps dont le Content-Type n’est pas application/json est rejeté en 415 avant lecture ou validation du corps.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeatureDisabled:
      description: Fonction désactivée; aucune donnée de la capacité concernée n’est acceptée, persistée ou retournée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FeatureDisabledProblem' }
    Problem:
      description: Erreur de traitement.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        traceId: { type: string, maxLength: 80 }
        code: { type: string, maxLength: 80 }
    FeatureDisabledProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, feature, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, const: 503 }
        code: { type: string, const: FEATURE_DISABLED }
        feature:
          type: string
          enum: [guest_quiz_session, quiz_attempt_persistence, quiz_attempt_history, imported_quiz_results, contact_storage]
        detail: { type: string }
        traceId: { type: string, maxLength: 80 }
    ValidationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        traceId: { type: string, maxLength: 80 }
        code: { type: string, maxLength: 80 }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    AuthSession:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, csrfRequired]
          properties:
            user: { $ref: '#/components/schemas/CurrentUser' }
            csrfRequired: { type: boolean }
    ReauthenticationGrant:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [reauthenticationToken, expiresAt, singleUse]
          properties:
            reauthenticationToken: { type: string, minLength: 32, maxLength: 256, description: Secret rendu une fois; fournir dans AccountDeletionRequest et ne jamais journaliser. }
            expiresAt: { type: string, format: date-time }
            singleUse: { type: boolean, const: true }
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [reauthenticationToken, confirm]
      properties:
        reauthenticationToken: { type: string, minLength: 32, maxLength: 256, writeOnly: true }
        confirm: { type: boolean, const: true }
    GuestQuizSession:
      type: object
      description: Schéma de session différé; le endpoint de création retourne actuellement 503 et n’émet aucun token.
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [sessionToken, quizId, quizVersion, sessionId]
          properties:
            sessionToken: { type: string, minLength: 32, maxLength: 256, description: Secret rendu une fois; envoyer uniquement dans X-Quiz-Session et ne jamais journaliser. }
            quizId: { type: string, format: uuid }
            quizVersion: { type: integer, minimum: 1 }
            sessionId: { type: string, format: uuid }
    CurrentUser:
      type: object
      required: [id, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        status: { type: string, enum: [active, deletion_pending] }
    Profile:
      type: object
      required: [displayName, interests, theme, resourceLanguage, learningMode, locale]
      properties:
        displayName: { type: [string, "null"], maxLength: 60 }
        avatar:
          type: object
          additionalProperties: true
          description: Avatar cosmétique; pas de donnée biologique ou identifiante requise.
        interests:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        theme: { type: string, enum: [light, dark] }
        resourceLanguage: { type: string, enum: [fr, en, es] }
        learningMode: { type: string, enum: [guided, free] }
        locale: { type: string, maxLength: 16 }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: [string, "null"], maxLength: 60 }
        avatar:
          type: object
          additionalProperties: true
          maxProperties: 8
        interests:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        theme: { type: string, enum: [light, dark] }
        resourceLanguage: { type: string, enum: [fr, en, es] }
        learningMode: { type: string, enum: [guided, free] }
        locale: { type: string, maxLength: 16 }
    Domain:
      type: object
      required: [id, familyId, name, summary, availability]
      properties:
        id: { type: string, maxLength: 100 }
        familyId: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        summary: { type: string, maxLength: 2000 }
        availability: { type: string, const: published }
        publishedAt: { type: string, format: date-time }
    DomainDetail:
      allOf:
        - $ref: '#/components/schemas/Domain'
        - type: object
          required: [pathways]
          properties:
            pathways:
              type: array
              items: { $ref: '#/components/schemas/PathwaySummary' }
    PathwaySummary:
      type: object
      required: [id, title, version, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 180 }
        version: { type: integer, minimum: 1 }
        status: { type: string, const: published }
    Pathway:
      type: object
      required: [id, domainId, title, eyebrow, version, status, weeks, projects, skills, careerExamples]
      properties:
        id: { type: string, format: uuid }
        domainId: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 180 }
        eyebrow: { type: [string, "null"], maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        overview: { type: string, maxLength: 3000 }
        version: { type: integer, minimum: 1 }
        status: { type: string, const: published }
        difficulty: { type: string, maxLength: 60 }
        prerequisites: { type: array, items: { type: string, maxLength: 500 } }
        equipment: { type: array, items: { type: string, maxLength: 500 } }
        skills:
          type: array
          description: Compétences pédagogiques visées; libellés, sans promesse de qualification.
          items: { type: string, maxLength: 240 }
        careerExamples:
          type: array
          description: Exemples de métiers associés, sans garantie d’emploi.
          items: { type: string, maxLength: 240 }
        weeklyTime: { type: [string, "null"], maxLength: 120 }
        safetyNote: { type: [string, "null"], maxLength: 2000 }
        weeks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PathwayWeek' }
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectBrief' }
        completionPolicy:
          anyOf:
            - $ref: '#/components/schemas/CompletionPolicy'
            - type: "null"
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
    PathwayWeek:
      type: object
      required: [id, position, title, lessons]
      properties:
        id: { type: string, maxLength: 100 }
        position: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 180 }
        label: { type: string, maxLength: 100 }
        lessons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Lesson' }
    Lesson:
      type: object
      required: [id, position, title, objective, quizzes]
      properties:
        id: { type: string, maxLength: 120 }
        position: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 180 }
        objective: { type: string, maxLength: 1000 }
        explanation: { type: string, maxLength: 12000 }
        activity: { type: string, maxLength: 4000 }
        durationMinutes: { type: [integer, "null"], minimum: 1 }
        resourceIds:
          type: array
          items: { type: string, format: uuid }
        quizzes:
          type: array
          items: { $ref: '#/components/schemas/QuizSummary' }
    QuizSummary:
      type: object
      required: [id, questionCount]
      properties:
        id: { type: string, format: uuid }
        questionCount: { type: integer, minimum: 1 }
    ProjectBrief:
      type: object
      required: [id, title, instructions, checklist]
      properties:
