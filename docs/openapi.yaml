  /me/saved-resources:
    get:
      tags: [Mon espace]
      operationId: listSavedResources
      summary: Lister ma bibliothèque
      x-rate-limit: profileRead
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ressources enregistrées.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SavedResource' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Mon espace]
      operationId: saveResource
      summary: Enregistrer une ressource dans ma bibliothèque
      description: Accepter seulement une URL HTTPS sans identifiants URL. Parser puis normaliser l’URL; si l’hôte est une IP littérale, vérifier directement qu’elle est publiquement routable; pour un nom d’hôte, résoudre tous les résultats DNS A et AAAA et rejeter si la réponse est vide/invalide ou si un seul résultat n’est pas publiquement routable (notamment privé, réservé, loopback, link-local ou metadata). Ne faire aucun appel HTTP ni scraping lors de la validation. Ne persister ni secrets, ni résultats DNS, ni données d’hôte dérivées au-delà de l’URL normalisée; revalider la résolution au moment de toute utilisation future côté serveur.
      x-rate-limit: accountWrite
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, title]
              properties:
                url: { type: string, format: uri, maxLength: 1000, description: HTTPS seulement; aucune information d’authentification dans l’URL. }
                title: { type: string, minLength: 1, maxLength: 180 }
                source: { type: string, maxLength: 100 }
                resourceId: { type: [string, "null"], format: uuid }
      responses:
        '201':
          description: Ressource enregistrée (HTTPS uniquement).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SavedResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        default: { $ref: '#/components/responses/Problem' }
